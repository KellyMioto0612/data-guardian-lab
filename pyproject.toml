[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "data-guardian-lab"
version = "0.1.0"
description = "Observabilidade explicável para Engenharia de Dados"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Data Guardian Lab" }]
dependencies = [
    "pandas>=2.2,<3",
    "plotly>=5.23,<6",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "sqlglot>=25,<26",
    "streamlit>=1.36,<2",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.17,<2", "azure-monitor-query>=1.3,<2"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5.0,<6", "ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
